<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlow BizMail 系統流程圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:  'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · AquaFlow BizMail</p>
    <h1>AquaFlow BizMail 系統流程圖</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aquaflow-title aquaflow-desc">
        <title id="aquaflow-title">AquaFlow BizMail 系統流程圖</title>
        <desc id="aquaflow-desc">流程圖說明 AquaFlow BizMail 從輸入中文草稿、Phase 1 設定關係與語氣、判斷 API 金鑰並分支至真實 LLM 或離線範本，最後輸出四區塊英文書信的決策流程。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== Arrows (drawn first, behind nodes) ===== -->

        <!-- Start → Phase1 -->
        <line x1="320" y1="88" x2="320" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Phase1 → Generate -->
        <line x1="320" y1="168" x2="320" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Generate → Diamond1 -->
        <line x1="320" y1="248" x2="320" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond1 → Call LLM (coral happy path) -->
        <line x1="320" y1="352" x2="320" y2="376" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Diamond1 → Mock (NO) -->
        <path d="M430 308 H560 V392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Call LLM → Diamond2 -->
        <line x1="320" y1="432" x2="320" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond2 → Mock (failure) -->
        <path d="M430 492 H572 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Mock → End -->
        <line x1="600" y1="448" x2="600" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond2 → End (YES) -->
        <line x1="320" y1="536" x2="320" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ===== Arrow labels ===== -->

        <!-- Diamond1 → Call LLM: 有 KEY -->
        <rect x="328" y="354" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="350" y="365" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">有 KEY</text>

        <!-- Diamond1 → Mock: 無 KEY -->
        <rect x="568" y="344" width="44" height="16" rx="2" fill="#f5f5f5"/>
        <text x="590" y="355" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">無 KEY</text>

        <!-- Diamond2 → Mock: 失敗 -->
        <rect x="580" y="458" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="596" y="469" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">失敗</text>

        <!-- Diamond2 → End: 成功 -->
        <rect x="328" y="542" width="32" height="16" rx="2" fill="#f5f5f5"/>
        <text x="344" y="553" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">成功</text>

        <!-- ===== Nodes ===== -->

        <!-- Start oval: 輸入中文草稿 -->
        <rect x="220" y="40" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">輸入中文草稿</text>

        <!-- Step: Phase 1 -->
        <rect x="220" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="133" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">Phase 1 · 勾選</text>
        <text x="320" y="151" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">關係與期待語氣</text>

        <!-- Step: Generate -->
        <rect x="220" y="192" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">點「生成英文書信」</text>

        <!-- Diamond 1: API Key 已填? -->
        <polygon points="320,264 430,308 320,352 210,308" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">API Key</text>
        <text x="320" y="317" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">已填?</text>

        <!-- Step: Call LLM -->
        <rect x="220" y="376" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">呼叫 LLM API</text>
        <text x="320" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">callRealLLM() · fetch</text>

        <!-- Diamond 2: API 連線成功? -->
        <polygon points="320,448 430,492 320,536 210,492" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">API 連線</text>
        <text x="320" y="501" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">解析成功?</text>

        <!-- Step: Offline mock (optional/fallback treatment) -->
        <rect x="560" y="392" width="260" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="690" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">離線範本輸出</text>
        <text x="690" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">renderPlumbingMock()</text>

        <!-- End oval: Phase 2 output (focal coral) -->
        <rect x="160" y="560" width="520" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="420" y="582" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">Phase 2 · 四區塊輸出</text>
        <text x="420" y="600" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans TC', sans-serif" text-anchor="middle">主旨 · 正文 · 風險提醒 · 閱讀體感</text>

        <!-- ===== Legend ===== -->
        <line x1="40" y1="636" x2="960" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="656" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">開始 / 結束</text>

        <rect x="220" y="656" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">步驟</text>

        <polygon points="412,662 424,656 436,662 424,668" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">決策</text>

        <rect x="608" y="656" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="640" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">離線 / 退回</text>

        <line x1="800" y1="662" x2="828" y2="662" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="836" y="666" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Noto Sans TC', sans-serif">現要路徑</text>

      </svg>
    </div>
  </div>
</body>
</html>
